<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="GMS Integra — ERP Integral de Procesos">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="55%" stop-color="#0f3a63"/>
      <stop offset="100%" stop-color="#1c5a8c"/>
    </linearGradient>
    <linearGradient id="pane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#97cadb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3178c6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1300" cy="200" r="300" fill="#97cadb" fill-opacity="0.18" filter="url(#blur1)"/>
  <circle cx="200" cy="850" r="260" fill="#3178c6" fill-opacity="0.2" filter="url(#blur1)"/>

  <!-- Panel de vidrios (referencia al producto: ventanas y mamparas) -->
  <g transform="translate(880,240)" stroke="#f4f7fa" stroke-opacity="0.35" stroke-width="3">
    <rect x="0" y="220" width="130" height="160" fill="url(#pane)"/>
    <rect x="140" y="150" width="130" height="230" fill="url(#pane)"/>
    <rect x="280" y="70" width="130" height="310" fill="url(#pane)"/>
    <rect x="420" y="150" width="130" height="230" fill="url(#pane)"/>
    <rect x="560" y="0" width="130" height="380" fill="url(#pane)"/>
  </g>

  <!-- Flujo de procesos (referencia al ERP) -->
  <g stroke="#97cadb" stroke-width="3" stroke-opacity="0.6" fill="none">
    <path d="M 140 560 L 380 560 L 380 700 L 620 700 L 620 480 L 860 480"/>
  </g>
  <g fill="#f4f7fa">
    <circle cx="140" cy="560" r="9"/>
    <circle cx="380" cy="560" r="9"/>
    <circle cx="380" cy="700" r="9"/>
    <circle cx="620" cy="700" r="9"/>
    <circle cx="620" cy="480" r="9"/>
    <circle cx="860" cy="480" r="9"/>
  </g>
  <g fill="none" stroke="#f4f7fa" stroke-opacity="0.5">
    <circle cx="140" cy="560" r="17"/>
    <circle cx="620" cy="480" r="17"/>
  </g>

  <g transform="translate(120,140)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#97cadb">ERP INTEGRAL DE PROCESOS</text>
  </g>
</svg>
